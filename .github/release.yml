# GitHub release-notes configuration for tizen-agent-skills.
#
# This file controls the auto-generated notes that GitHub produces when a
# release is created from the web UI or when --generate-notes is used.
#
# The repository now releases as a whole under the tizen-agent-skills-v* tag
# prefix. A unified release legitimately includes every PR (tizen-sdk-skills,
# tizen-action-skills and root docs), so no per-plugin filtering is needed.
# This file only categorises the PRs by label for a nicer presentation.
#
# Labels used by the issue templates: "tizen-sdk-skills", "tizen-action-skills".
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "⚠️ Breaking Changes"
      labels:
        - breaking
    - title: "🚀 Features"
      labels:
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "📚 Documentation"
      labels:
        - documentation
    - title: "🔧 Other Changes"
      labels:
        - "*"
