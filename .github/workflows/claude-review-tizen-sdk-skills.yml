name: Claude Review (tizen-sdk-skills)

# AI first-pass review for pull requests that touch tizen-sdk-skills/.
# Not a required status check, so the `paths:` filter is safe here.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "tizen-sdk-skills/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

# A newer push to the same PR supersedes the older review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Review
    # Fork PRs get no secrets; skip them and draft PRs.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR's changes under tizen-sdk-skills/ only.
            Follow AGENTS.md and tizen-sdk-skills/CONTRIBUTING.md. Check especially:
            - logic belongs in common/; host wrappers (claude/ cline/ codex/ gemini/) stay thin
            - package.json and common/.claude-plugin/plugin.json versions in sync
            - English docs changed => matching .ko.md mirror updated
            - no internal hostnames, private IPs, home paths, credentials
            - correctness bugs, missing error handling on process exit codes, cross-platform issues
            Post inline comments for concrete issues and one short summary comment.
            Do not comment on style that ESLint/Prettier already enforce.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
