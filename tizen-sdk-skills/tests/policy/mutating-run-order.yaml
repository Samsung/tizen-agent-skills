# Hand-ordered run for the cli-lane mutating-tier TCs that a provisioned host
# can execute without reinstalling anything.
#
# Why this file exists: runner.mjs executes TCs in readdir (alphabetical) order
# with no setup/teardown, and for the mutating tier that order cannot pass —
# `build-project.*` sorts before the `create-project.*` TC that makes the
# project it builds, `project-delete.happy` would delete that project before
# the later builds, `certificate-manager.remove-profile` consumes its fixture
# profiles.xml, and `generate-author` / `import-certificate` refuse to
# overwrite the certificates a previous run left in <sdk-data>/keystore/.
#
# Usage (normally via scripts/run-mutating-tier.mjs, which adds the preflight,
# the profile-fixture backup/restore, the keystore cleanup, the projects-dir
# reset and the teardown; the runner MUST run with cwd = tests/, because the
# certificate TCs use `fixtures/...` relative paths):
#   node runner.mjs --tier=mutating --status=approved --order=policy/mutating-run-order.yaml [--phase=<name>]
#   node runner.mjs --dry-run   --tier=mutating --order=policy/mutating-run-order.yaml
#
# Ids are matched against the TCs that survive --tier/--status, so with
# --status=approved a draft id listed here fails loudly (exit 2); the driver's
# --include-drafts drops that filter for promotion runs. Phase names must not
# collide with policy/device-run-order.yaml (both share FIXTURE_NEEDS in
# scripts/lib/driver-common.mjs; runner-helpers.test.mjs checks).
#
# NOT listed on purpose (draft, reason in each TC's NOTE): the Samsung online-CA
# actions (samsung-login, generate-samsung-* — a real account and a real
# certificate) and the GBS builds (build-project.arch / .gbs — Linux only).
#
# Phases s2/s3 are the SDK INSTALLERS. The driver skips them unless
# --with-installers (or --phase= names one): s2 downloads ~10 GB into a
# throwaway home the driver points USERPROFILE/HOME at, with
# TIZEN_SDK_INLINE_INSTALLER=1 so the installer branch runs inline instead of
# coming back as suggested_fix (common/lib/core/sdk.js runsInstallerInline);
# s3 reinstalls the host's real .NET Tizen workload.
#
# Invariants the order relies on:
#   * s1 needs an installed SDK with platforms/tizen-10.0, <sdk>/.tv-sdk-installed
#     and the Tizen .NET workload: every command there takes its
#     already-installed short-circuit and downloads nothing. The three
#     --repo-url TCs still validate the URL over the network (capability net).
#   * k2 needs <sdk-data>/keystore free of TestDev / Jane-Dev / TestDev-v2 and
#     of the two imported copies of test-fixture-author.p12 — hook cleanKeystore.
#   * k3: create-profile writes a scratch profiles.xml under
#     ${FIXTURE_TMP_DIR}/profiles (never the SDK's real one, whose myProfile the
#     builds sign with); set-active-profile / remove-profile edit the committed
#     fixtures under fixtures/profiles/ — hook resetProfileFixtures restores the
#     backup first, the teardown restores it again.
#   * p1: create-project.native-happy runs first because build-project.* and
#     project-delete.happy target the MyNativeApp it creates under
#     ${FIXTURE_PROJECTS_DIR} (emptied by hook resetProjectsDir);
#     create-project.force is listed twice so the second run is a real
#     overwrite; build-project.release signs with the active myProfile that
#     scripts/prepare-device-fixtures.mjs creates; project-delete is last.
#     build-project.compiler-flags fails in Commander's parser (unknown
#     option) and touches nothing.
#   * s2 runs against an EMPTY home: sdk-install-custom-repo.force goes first
#     because on an empty dir --force is just the real install (sdk.info,
#     the scratch ~/.tizen.sdk.path.config, repository.info); the platform /
#     emulator / mobile installers then add packages and write their
#     <sdk>/.*-installed markers (download-emulator-package.happy is the
#     short-circuit on the marker .specific-version wrote); update-package
#     needs an installed SDK; install-rootstrap needs sdk.info and the ZIP
#     fixture ${FIXTURE_ROOTSTRAP_ZIP}; sdk-install.force is LAST so it is a
#     real --force over an existing SDK (the per-package skip keeps it short).
#     The driver deletes TIZEN_SDK_PATH from the phase env: Get-SdkPath in
#     common/scripts/lib/common.ps1 would otherwise find the real SDK.
#   * s3 has no home redirect: the workload lands in the real dotnet install,
#     and a redirected USERPROFILE would only send NuGet to the scratch dir.

phases:
  # Already-installed short-circuits of the SDK installers. ~1 min.
  - name: s1-sdk-idempotent
    tcs:
      - tizen-sdk.sdk-install.happy
      - tizen-sdk.sdk-install.specific-version
      - tizen-sdk.sdk-install.custom-repo # validates ${TC_CUSTOM_REPO_URL} over the network first
      - tizen-sdk.sdk-install-custom-repo.happy
      - tizen-sdk.sdk-install-custom-repo.specific-version
      - tizen-sdk.tv-sdk-install.happy
      - tizen-sdk.dotnet-setup.happy
      - tizen-sdk.dotnet-setup.specific-version

  # Read-only certificate actions. ~10 s.
  - name: k1-cert-readonly
    tcs:
      - tizen-sdk.certificate-manager.list-profiles
      - tizen-sdk.certificate-manager.list-distributors
      - tizen-sdk.certificate-manager.inspect-certificate

  # Hook cleanKeystore. Writes under <sdk-data>/keystore/{author,distributor}. ~30 s.
  - name: k2-cert-keystore
    tcs:
      - tizen-sdk.certificate-manager.generate-author # TestDev.p12
      - tizen-sdk.certificate-manager.generate-author-full # Jane-Dev.p12
      - tizen-sdk.certificate-manager.generate-author-overwrite # TestDev-v2.p12 (same --name, new --file)
      - tizen-sdk.certificate-manager.import-certificate # author/test-fixture-author.p12
      - tizen-sdk.certificate-manager.import-certificate-from-file # distributor/test-fixture-author.p12

  # Hook resetProfileFixtures. profiles.xml files only. ~10 s.
  - name: k3-cert-profiles
    tcs:
      - tizen-sdk.certificate-manager.create-profile # scratch ${FIXTURE_TMP_DIR}/profiles/created-profiles.xml
      - tizen-sdk.certificate-manager.set-active-profile # fixtures/profiles/with-profile.xml
      - tizen-sdk.certificate-manager.remove-profile # fixtures/profiles/with-profile-for-removal.xml (consumed)

  # Hook resetProjectsDir. create → build → delete under ${FIXTURE_PROJECTS_DIR}. ~3 min.
  - name: p1-projects
    tcs:
      - tizen-sdk.create-project.native-happy # MyNativeApp — the build/delete target
      - tizen-sdk.build-project.compiler-flags # --cflags rejected by the parser (invalid_argument)
      - tizen-sdk.create-project.webapp-happy # MyWebApp01
      - tizen-sdk.create-project.dotnet-happy # MyDotNetApp
      - tizen-sdk.create-project.force # MyForceApp01 (fresh)
      - tizen-sdk.create-project.force # MyForceApp01 again — the real overwrite path
      - tizen-sdk.build-project.happy # Debug, active profile
      - tizen-sdk.build-project.clean
      - tizen-sdk.build-project.release # --sign-profile myProfile
      - tizen-sdk.project-delete.happy # MyNativeApp gone

  # INSTALLERS — skipped without --with-installers. Real installs into the
  # throwaway home <scratch>/home (USERPROFILE/HOME redirected, TIZEN_SDK_PATH
  # removed, TIZEN_SDK_INLINE_INSTALLER=1). ~10 GB download, 60-90 min.
  - name: s2-sdk-installers
    tcs:
      - tizen-sdk.sdk-install-custom-repo.force # empty home → the real install (sdk.info, scratch path config)
      - tizen-sdk.tv-sdk-install.force
      - tizen-sdk.platform-install.happy # 10.0 → .platform-installed
      - tizen-sdk.download-emulator-package.specific-version # 10.0 → .emulator-package-installed
      - tizen-sdk.download-emulator-package.happy # short-circuit on that marker
      - tizen-sdk.download-emulator-package.force
      - tizen-sdk.download-mobile-platform.happy # 7.5 (MOBILE-10.0 does not exist in the repo)
      - tizen-sdk.download-mobile-platform.iot-headed
      - tizen-sdk.update-package.dry-run
      - tizen-sdk.update-package.happy
      - tizen-sdk.update-package.force
      - tizen-sdk.install-rootstrap.happy # ${FIXTURE_ROOTSTRAP_ZIP}
      - tizen-sdk.sdk-install.force # last: --force over the SDK the phase built

  # INSTALLERS — skipped without --with-installers. No home redirect:
  # reinstalls the host's real .NET Tizen workload (network, several minutes).
  - name: s3-dotnet-workload
    tcs:
      - tizen-sdk.dotnet-setup.force
