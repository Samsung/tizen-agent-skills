# TC-CLI-081: Launch mode
id: tizen-sdk.dotnet-debug.launch
plugin: tizen-sdk
command: dotnet-debug
tier: device
status: approved
since_cli: 1.0.0
description: "dotnet-debug --app-id --mode launch returns success"

lanes:
  cli:
    # NOTE (2026-09-22): /tmp fixture paths and hardcoded app ids replaced by ${FIXTURE_*}
    # placeholders (scripts/prepare-device-fixtures.mjs); executed on Windows via
    # run-device-tier.mjs --include-drafts — passed; promoted draft → approved.
    argv: ["tizen-sdk", "dotnet-debug", "--app-id", "${FIXTURE_DOTNET_APP_ID}", "--mode", "launch"]
    timeout_sec: 120
    expect:
      status: success
