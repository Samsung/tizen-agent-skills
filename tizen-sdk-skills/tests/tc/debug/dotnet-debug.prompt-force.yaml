# TC-P-063: Prompt — Force reinstall netcoredbg
id: tizen-sdk.dotnet-debug.prompt-force
plugin: tizen-sdk
command: dotnet-debug
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to dotnet-debug command"

lanes:
  prompt:
    text: "Force reinstall netcoredbg and debug my .NET app."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk dotnet-debug"
      envelope_status: success
    pass_rate: "2/3"
