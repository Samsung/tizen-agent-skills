# TC-P-062: Prompt — Debug .NET app on specific device
id: tizen-sdk.dotnet-debug.prompt-serial
plugin: tizen-sdk
command: dotnet-debug
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to dotnet-debug command"

lanes:
  prompt:
    text: "Debug my .NET app on emulator-26101."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk dotnet-debug"
      envelope_status: success
    pass_rate: "2/3"
