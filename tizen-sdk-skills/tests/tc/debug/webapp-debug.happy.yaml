# TC-CLI-086: Default port 9222
id: tizen-sdk.webapp-debug.happy
plugin: tizen-sdk
command: webapp-debug
tier: device
status: draft
since_cli: 1.0.0
description: "webapp-debug --app-id returns success with cdp_endpoint"

lanes:
  cli:
    # NOTE (2026-09-17): NOT executed in the Windows safe+device pass — needs the web app abcDEF1234.MyWebApp installed on the device.
    # Kept draft pending a Linux/WSL fixture run.
    argv: ["tizen-sdk", "webapp-debug", "--app-id", "abcDEF1234.MyWebApp"]
    timeout_sec: 120
    expect:
      status: success
      jsonpath:
        - { path: "$.result.cdp_endpoint", min_length: 1 }
