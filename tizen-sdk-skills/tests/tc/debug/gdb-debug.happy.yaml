# TC-CLI-075: Attach mode (default)
id: tizen-sdk.gdb-debug.happy
plugin: tizen-sdk
command: gdb-debug
tier: device
status: draft
since_cli: 1.0.0
description: "gdb-debug --app-id --binary returns success with gdb_command"

lanes:
  cli:
    # NOTE (2026-09-17): NOT executed in the Windows safe+device pass — needs org.tizen.myapp installed on the device and the host binary /tmp/MyApp/bin/MyApp.
    # Kept draft pending a Linux/WSL fixture run.
    argv: ["tizen-sdk", "gdb-debug", "--app-id", "org.tizen.myapp", "--binary", "/tmp/MyApp/bin/MyApp"]
    timeout_sec: 120
    expect:
      status: success
      jsonpath:
        - { path: "$.result.gdb_command", min_length: 1 }
