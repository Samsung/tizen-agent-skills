# TC-P-065: Prompt — Debug web app with custom port
id: tizen-sdk.webapp-debug.prompt-custom-port
plugin: tizen-sdk
command: webapp-debug
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to webapp-debug command"

lanes:
  prompt:
    text: "Debug my Tizen web app on port 9223."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk webapp-debug"
      envelope_status: success
    pass_rate: "2/3"
