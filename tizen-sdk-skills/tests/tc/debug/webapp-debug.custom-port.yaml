# TC-CLI-087: Custom port
id: tizen-sdk.webapp-debug.custom-port
plugin: tizen-sdk
command: webapp-debug
tier: device
status: draft
since_cli: 1.0.0
description: "webapp-debug --app-id --port 9223 returns success with cdp_endpoint"

lanes:
  cli:
    # NOTE (2026-09-17): NOT executed in the Windows safe+device pass — needs the web app abcDEF1234.MyWebApp installed on the device.
    # Kept draft pending a Linux/WSL fixture run.
    argv: ["tizen-sdk", "webapp-debug", "--app-id", "abcDEF1234.MyWebApp", "--port", "9223"]
    timeout_sec: 120
    expect:
      status: success
      jsonpath:
        - { path: "$.result.cdp_endpoint", min_length: 1 }
