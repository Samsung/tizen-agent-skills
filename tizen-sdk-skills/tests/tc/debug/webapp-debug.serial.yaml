# TC-CLI-088: On specific device
id: tizen-sdk.webapp-debug.serial
plugin: tizen-sdk
command: webapp-debug
tier: device
status: approved
since_cli: 1.0.0
description: "webapp-debug --app-id --serial returns success with cdp_endpoint"

lanes:
  cli:
    # NOTE (2026-09-22): /tmp fixture paths and hardcoded app ids replaced by ${FIXTURE_*}
    # placeholders (scripts/prepare-device-fixtures.mjs); executed on Windows via
    # run-device-tier.mjs --include-drafts — passed; promoted draft → approved.
    argv: ["tizen-sdk", "webapp-debug", "--app-id", "${FIXTURE_WEB_APP_ID}", "--serial", "emulator-26101"]
    timeout_sec: 120
    expect:
      status: success
      jsonpath:
        - { path: "$.result.cdp_endpoint", min_length: 1 }
