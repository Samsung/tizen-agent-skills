# TC-CLI-077: With breakpoints
id: tizen-sdk.gdb-debug.breakpoints
plugin: tizen-sdk
command: gdb-debug
tier: device
status: approved
since_cli: 1.0.0
description: "gdb-debug --app-id --binary --breakpoints returns success with gdb_command"

lanes:
  cli:
    # NOTE (2026-09-22): /tmp fixture paths and hardcoded app ids replaced by ${FIXTURE_*}
    # placeholders (scripts/prepare-device-fixtures.mjs); executed on Windows via
    # run-device-tier.mjs --include-drafts — passed; promoted draft → approved.
    argv: ["tizen-sdk", "gdb-debug", "--app-id", "${FIXTURE_NATIVE_APP_ID}", "--binary", "${FIXTURE_NATIVE_BIN}", "--breakpoints", "main,service_app_create"]
    timeout_sec: 120
    expect:
      status: success
      jsonpath:
        - { path: "$.result.gdb_command", min_length: 1 }
