# TC-CLI-077: With breakpoints
id: tizen-sdk.gdb-debug.breakpoints
plugin: tizen-sdk
command: gdb-debug
tier: device
status: draft
since_cli: 1.0.0
description: "gdb-debug --app-id --binary --breakpoints returns success with gdb_command"

lanes:
  cli:
    argv: ["tizen-sdk", "gdb-debug", "--app-id", "org.tizen.myapp", "--binary", "/tmp/MyApp/bin/MyApp", "--breakpoints", "main,service_app_create"]
    timeout_sec: 120
    expect:
      status: success
      jsonpath:
        - { path: "$.result.gdb_command", min_length: 1 }
