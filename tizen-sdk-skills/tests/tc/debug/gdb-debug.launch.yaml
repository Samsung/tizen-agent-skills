# TC-CLI-076: Launch mode
id: tizen-sdk.gdb-debug.launch
plugin: tizen-sdk
command: gdb-debug
tier: device
status: draft
since_cli: 1.0.0
description: "gdb-debug --app-id --binary --mode launch returns success with gdb_command"

lanes:
  cli:
    argv: ["tizen-sdk", "gdb-debug", "--app-id", "org.tizen.myapp", "--binary", "/tmp/MyApp/bin/MyApp", "--mode", "launch"]
    timeout_sec: 120
    expect:
      status: success
      jsonpath:
        - { path: "$.result.gdb_command", min_length: 1 }
