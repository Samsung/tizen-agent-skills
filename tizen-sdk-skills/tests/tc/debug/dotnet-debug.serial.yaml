# TC-CLI-083: On specific device
id: tizen-sdk.dotnet-debug.serial
plugin: tizen-sdk
command: dotnet-debug
tier: device
status: draft
since_cli: 1.0.0
description: "dotnet-debug --app-id --serial returns success"

lanes:
  cli:
    # NOTE (2026-09-17): NOT executed in the Windows safe+device pass — needs the .NET app org.tizen.example.MyApp installed on the device.
    # Kept draft pending a Linux/WSL fixture run.
    argv: ["tizen-sdk", "dotnet-debug", "--app-id", "org.tizen.example.MyApp", "--serial", "emulator-26101"]
    timeout_sec: 120
    expect:
      status: success
