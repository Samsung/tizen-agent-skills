# TC-CLI-089: Custom timeout
id: tizen-sdk.webapp-debug.timeout
plugin: tizen-sdk
command: webapp-debug
tier: device
status: draft
since_cli: 1.0.0
description: "webapp-debug --app-id --timeout 60 returns success with cdp_endpoint"

lanes:
  cli:
    argv: ["tizen-sdk", "webapp-debug", "--app-id", "abcDEF1234.MyWebApp", "--timeout", "60"]
    timeout_sec: 120
    expect:
      status: success
      jsonpath:
        - { path: "$.result.cdp_endpoint", min_length: 1 }
