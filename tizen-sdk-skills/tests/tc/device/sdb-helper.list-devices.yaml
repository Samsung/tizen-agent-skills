# TC-CLI-099: List devices
id: tizen-sdk.sdb-helper.list-devices
plugin: tizen-sdk
command: sdb-helper
tier: device
status: approved
since_cli: 1.0.0
description: "sdb-helper --request 'list devices' hands off to tizen-device-manager"

lanes:
  cli:
    argv: ["tizen-sdk", "sdb-helper", "--request", "list devices"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        # "list devices" is a handoff intent, like "take a screenshot": the runner
        # returns handoff/suggested_skill instead of a command — fixed 2026-09-17.
        - { path: "$.result.handoff", equals: "tizen-device-manager" }
        - { path: "$.result.suggested_skill", equals: "tizen-device-manager" }
