# TC-CLI-099: List devices
id: tizen-sdk.sdb-helper.list-devices
plugin: tizen-sdk
command: sdb-helper
tier: device
status: draft
since_cli: 1.0.0
description: "sdb-helper --request 'list devices' returns success with command"

lanes:
  cli:
    argv: ["tizen-sdk", "sdb-helper", "--request", "list devices"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        - { path: "$.result.command", min_length: 1 }
