# TC-P-047: Prompt — Delete emulator VM
id: tizen-sdk.emulator-manager.prompt-delete
plugin: tizen-sdk
command: emulator-manager
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to emulator-manager command"

lanes:
  prompt:
    text: "Delete my Tizen emulator VM."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk emulator-manager"
      envelope_status: success
    pass_rate: "2/3"
