# TC-CLI-093: Screenshot on specific device
id: tizen-sdk.screenshot.serial
plugin: tizen-sdk
command: screenshot
tier: device
status: approved
since_cli: 1.0.0
description: "screenshot --serial returns success on specific device"

lanes:
  cli:
    argv: ["tizen-sdk", "screenshot", "--serial", "emulator-26101"]
    # NOTE (2026-09-23): 30 s was marginal (21-29 s measured; see screenshot.happy). Raised to 60 s.
    timeout_sec: 60
    expect:
      status: success
      jsonpath:
        # Result key is `output_path`, not `screenshot_path` (fixed 2026-09-17).
        # Writes ./emulator_screenshot.png into the cwd: run from a scratch directory.
        - { path: "$.result.output_path", min_length: 1 }
        - { path: "$.result.device_serial", equals: "emulator-26101" }
