# TC-CLI-113: Connect with custom port
id: tizen-sdk.remote-device.connect-custom-port
plugin: tizen-sdk
command: remote-device
tier: device
status: draft
since_cli: 1.0.0
description: "remote-device --action connect --ip --port returns success"

requires:
  capabilities: [net-device]

# NOTE (2026-09-23): capability net-device declared (see remote-device.connect).
lanes:
  cli:
    # NOTE (2026-09-17): executed on Windows — environment failure, same as
    # remote-device.connect (no device at 192.168.1.50:26101). Kept draft.
    # NOTE (2026-09-22): still draft after the fixture pass — needs a network-reachable Tizen
    # device; 127.0.0.1 would duplicate the emulator's sdb row and break resolveSerial()
    # (see remote-device.connect).
    argv: ["tizen-sdk", "remote-device", "--action", "connect", "--ip", "192.168.1.50", "--port", "26101"]
    timeout_sec: 30
    expect:
      status: success
