# TC-CLI-044: Find connected device (default)
id: tizen-sdk.device-manager.happy
plugin: tizen-sdk
command: device-manager
tier: device
status: approved
since_cli: 1.0.0
description: "device-manager returns success with the selected device_serial"

lanes:
  cli:
    argv: ["tizen-sdk", "device-manager"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        # Result is a single selected device (SKILL.md: device_serial, device_type,
        # device_profile), not a devices[] array — fixed 2026-09-17 after a real run.
        - { path: "$.result.device_serial", min_length: 1 }
        - { path: "$.result.device_type", matches: "^(emulator|usb)$" }
