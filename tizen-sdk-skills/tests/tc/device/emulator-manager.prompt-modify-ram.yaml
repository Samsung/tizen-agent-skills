# TC-P-045: Prompt — Modify emulator RAM
id: tizen-sdk.emulator-manager.prompt-modify-ram
plugin: tizen-sdk
command: emulator-manager
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to emulator-manager command"

lanes:
  prompt:
    text: "Change the RAM size of my Tizen emulator to 4096MB."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk emulator-manager"
      envelope_status: success
    pass_rate: "2/3"
