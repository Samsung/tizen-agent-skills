# TC-CLI-103: Screenshot (hands off to tizen-screenshot)
id: tizen-sdk.sdb-helper.screenshot
plugin: tizen-sdk
command: sdb-helper
tier: device
status: approved
since_cli: 1.0.0
description: "sdb-helper --request 'take a screenshot' returns a handoff to tizen-screenshot (no sdb command is run)"

lanes:
  cli:
    argv: ["tizen-sdk", "sdb-helper", "--request", "take a screenshot"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        - { path: "$.result.handoff", equals: "tizen-screenshot" }
        - { path: "$.result.suggested_skill", equals: "tizen-screenshot" }
