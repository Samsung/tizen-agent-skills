# TC-CLI-103: Screenshot (hands off to tizen-screenshot)
id: tizen-sdk.sdb-helper.screenshot
plugin: tizen-sdk
command: sdb-helper
tier: device
status: draft
since_cli: 1.0.0
description: "sdb-helper --request 'take a screenshot' returns success with command and fallbacks"

lanes:
  cli:
    argv: ["tizen-sdk", "sdb-helper", "--request", "take a screenshot"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        - { path: "$.result.command", min_length: 1 }
