# TC-P-071: Prompt — List connected devices
id: tizen-sdk.sdb-helper.prompt-list-devices
plugin: tizen-sdk
command: sdb-helper
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to sdb-helper command"

lanes:
  prompt:
    text: "List all connected Tizen devices."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk sdb-helper"
      envelope_status: success
    pass_rate: "2/3"
