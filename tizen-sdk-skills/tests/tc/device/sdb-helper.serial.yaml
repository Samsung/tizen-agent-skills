# TC-CLI-104: On specific device
id: tizen-sdk.sdb-helper.serial
plugin: tizen-sdk
command: sdb-helper
tier: device
status: approved
since_cli: 1.0.0
description: "sdb-helper --request 'tail the logs' --serial returns a handoff to tizen-dlog-analyzer (logs are never run by sdb-helper)"

lanes:
  cli:
    argv: ["tizen-sdk", "sdb-helper", "--request", "tail the logs", "--serial", "emulator-26101"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        - { path: "$.result.handoff", equals: "tizen-dlog-analyzer" }
        - { path: "$.result.suggested_skill", equals: "tizen-dlog-analyzer" }
        - { path: "$.result.note", min_length: 1 }
