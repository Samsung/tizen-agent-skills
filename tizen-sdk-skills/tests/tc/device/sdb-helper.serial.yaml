# TC-CLI-104: On specific device
id: tizen-sdk.sdb-helper.serial
plugin: tizen-sdk
command: sdb-helper
tier: device
status: draft
since_cli: 1.0.0
description: "sdb-helper --request 'tail the logs' --serial returns success with command"

lanes:
  cli:
    argv: ["tizen-sdk", "sdb-helper", "--request", "tail the logs", "--serial", "emulator-26101"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        - { path: "$.result.command", min_length: 1 }
