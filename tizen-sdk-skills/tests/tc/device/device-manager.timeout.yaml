# TC-CLI-047: Custom timeout
id: tizen-sdk.device-manager.timeout
plugin: tizen-sdk
command: device-manager
tier: device
status: approved
since_cli: 1.0.0
description: "device-manager --timeout 120 returns success with the selected device_serial"

lanes:
  cli:
    argv: ["tizen-sdk", "device-manager", "--timeout", "120"]
    timeout_sec: 150
    expect:
      status: success
      jsonpath:
        # Same single-device result shape as device-manager.happy (fixed 2026-09-17).
        - { path: "$.result.device_serial", min_length: 1 }
        - { path: "$.result.device_type", matches: "^(emulator|usb)$" }
