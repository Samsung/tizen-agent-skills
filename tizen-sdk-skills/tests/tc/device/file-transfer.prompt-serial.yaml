# TC-P-081: Prompt — Transfer file to specific device
id: tizen-sdk.file-transfer.prompt-serial
plugin: tizen-sdk
command: file-transfer
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to file-transfer command"

lanes:
  prompt:
    text: "Push /tmp/test.txt to /tmp/ on emulator-26101."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk file-transfer"
      envelope_status: success
    pass_rate: "2/3"
