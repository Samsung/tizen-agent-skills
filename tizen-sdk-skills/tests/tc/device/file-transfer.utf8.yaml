# TC-CLI-108: With UTF-8 paths
id: tizen-sdk.file-transfer.utf8
plugin: tizen-sdk
command: file-transfer
tier: device
status: draft
since_cli: 1.0.0
description: "file-transfer --direction push --with-utf8 returns success"

lanes:
  cli:
    argv: ["tizen-sdk", "file-transfer", "--direction", "push", "--local", "/tmp/config.xml", "--remote", "/opt/usr/apps/", "--with-utf8"]
    timeout_sec: 60
    expect:
      status: success
