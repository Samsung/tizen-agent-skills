# TC-P-094: Prompt — List remote device bookmarks
id: tizen-sdk.remote-device.prompt-list-bookmarks
plugin: tizen-sdk
command: remote-device
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to remote-device command"

lanes:
  prompt:
    text: "Show my saved Tizen remote device bookmarks."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk remote-device"
      envelope_status: success
    pass_rate: "2/3"
