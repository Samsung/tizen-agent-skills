# TC-P-037: Prompt — Launch Tizen emulator
id: tizen-sdk.launch-emulator.prompt-happy
plugin: tizen-sdk
command: launch-emulator
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves 'Launch my Tizen emulator named test-vm' to launch-emulator"

lanes:
  prompt:
    text: "Launch my Tizen emulator named test-vm"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk launch-emulator"
      envelope_status: success
    pass_rate: "2/3"
