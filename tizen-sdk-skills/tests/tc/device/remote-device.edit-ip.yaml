# TC-CLI-120: Edit bookmark (change IP)
id: tizen-sdk.remote-device.edit-ip
plugin: tizen-sdk
command: remote-device
tier: device
status: draft
since_cli: 1.0.0
description: "remote-device --action edit --ip --new-ip --new-port returns success"

lanes:
  cli:
    argv: ["tizen-sdk", "remote-device", "--action", "edit", "--ip", "192.168.1.50", "--new-ip", "192.168.1.51", "--new-port", "26102"]
    timeout_sec: 30
    expect:
      status: success
