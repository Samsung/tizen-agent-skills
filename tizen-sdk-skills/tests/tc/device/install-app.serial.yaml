# TC-CLI-073: Install on specific device
id: tizen-sdk.install-app.serial
plugin: tizen-sdk
command: install-app
tier: device
status: approved
since_cli: 1.0.0
description: "install-app --package --serial returns success on specific device"

lanes:
  cli:
    # NOTE (2026-09-17): NOT executed in the Windows safe+device pass — needs the Linux fixture package /tmp/MyApp.tpk.
    # NOTE (2026-09-22): /tmp/MyApp.tpk replaced by ${FIXTURE_NATIVE_TPK} (built by
    # scripts/prepare-device-fixtures.mjs).
    # NOTE (2026-09-23): the expect block asserted $.result.device_id, a field the envelope has
    # never had — installApp returns device_serial; the TC now asserts it equals the --serial it
    # passed. Runs second in device phase c2-fixture-apps (a reinstall of the package
    # install-app.happy just installed). Executed on Windows via run-device-tier.mjs
    # --include-drafts on 2026-09-23 — passed; promoted draft → approved.
    argv: ["tizen-sdk", "install-app", "--package", "${FIXTURE_NATIVE_TPK}", "--serial", "emulator-26101"]
    timeout_sec: 120
    expect:
      status: success
      jsonpath:
        - { path: "$.result.device_serial", equals: "emulator-26101" }
