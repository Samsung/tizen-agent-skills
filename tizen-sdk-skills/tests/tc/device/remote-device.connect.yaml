# TC-CLI-112: Connect
id: tizen-sdk.remote-device.connect
plugin: tizen-sdk
command: remote-device
tier: device
status: draft
since_cli: 1.0.0
description: "remote-device --action connect --ip returns success"

requires:
  capabilities: [net-device]

# NOTE (2026-09-23): capability net-device declared — the run host must expose a Tizen device
# reachable over the network; the runner skips this TC with --skip-requires=net-device.
lanes:
  cli:
    # NOTE (2026-09-17): executed on Windows — environment failure (device_not_found):
    # nothing answers at 192.168.1.50 on this network ("failed to connect to remote
    # target" after 2 attempts). Kept draft; needs a reachable Tizen device
    # fixture. Side observation: the failure's suggested_fix points at
    # launch-emulator, which is unrelated to a network connect.
    # NOTE (2026-09-22): still draft after the fixture pass — needs a Tizen device reachable
    # over the network; no host fixture can stand in for it. Connecting to 127.0.0.1 (the
    # emulator's own sdbd) is not an option: it adds a second `sdb devices` row for the same
    # emulator and resolveSerial() (common/lib/core/sdb.js) then fails every following TC
    # with multiple_devices.
    argv: ["tizen-sdk", "remote-device", "--action", "connect", "--ip", "192.168.1.50"]
    timeout_sec: 30
    expect:
      status: success
