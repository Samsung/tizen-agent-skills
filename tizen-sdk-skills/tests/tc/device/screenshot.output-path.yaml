# TC-CLI-092: Screenshot with output path
id: tizen-sdk.screenshot.output-path
plugin: tizen-sdk
command: screenshot
tier: device
status: draft
since_cli: 1.0.0
description: "screenshot --output returns success with output_path at the specified location"

lanes:
  cli:
    # NOTE (2026-09-17): NOT executed in the Windows safe+device pass — writes to the Linux fixture path /tmp/shots/.
    # Kept draft pending a Linux/WSL fixture run.
    argv: ["tizen-sdk", "screenshot", "--output", "/tmp/shots/screen.png"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        # Result key is `output_path`, not `screenshot_path` (fixed 2026-09-17 while
        # correcting screenshot.happy; this TC itself was NOT executed — the /tmp/shots
        # path is a Linux fixture, environment-skip on Windows).
        - { path: "$.result.output_path", matches: 'shots[\\/]screen\.png$' }
