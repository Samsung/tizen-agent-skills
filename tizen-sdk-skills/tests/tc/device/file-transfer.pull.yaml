# TC-CLI-106: Pull
id: tizen-sdk.file-transfer.pull
plugin: tizen-sdk
command: file-transfer
tier: device
status: approved
since_cli: 1.0.0
description: "file-transfer --direction pull returns success with bytes_transferred"

lanes:
  cli:
    # NOTE (2026-09-22): /tmp fixture paths and hardcoded app ids replaced by ${FIXTURE_*}
    # placeholders (scripts/prepare-device-fixtures.mjs); executed on Windows via
    # run-device-tier.mjs --include-drafts — passed; promoted draft → approved.
    argv: ["tizen-sdk", "file-transfer", "--direction", "pull", "--remote", "/tmp/log.txt", "--local", "${FIXTURE_TMP_DIR}/logs/"]
    timeout_sec: 60
    expect:
      status: success
      jsonpath:
        - { path: "$.result.direction", matches: "pull" }
        - { path: "$.result.bytes_transferred", matches: "^\\d+" }
