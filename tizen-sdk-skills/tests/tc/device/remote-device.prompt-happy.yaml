# TC-P-089: Prompt 1 — Scan network for Tizen devices
id: tizen-sdk.remote-device.prompt-happy
plugin: tizen-sdk
command: remote-device
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves 'Scan my network for Tizen devices' to remote-device"

lanes:
  prompt:
    text: "Scan my network for Tizen devices"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk remote-device"
      envelope_status: success
    pass_rate: "2/3"
