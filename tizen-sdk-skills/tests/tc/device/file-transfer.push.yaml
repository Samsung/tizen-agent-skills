# TC-CLI-105: Push
id: tizen-sdk.file-transfer.push
plugin: tizen-sdk
command: file-transfer
tier: device
status: approved
since_cli: 1.0.0
description: "file-transfer --direction push returns success with bytes_transferred"

lanes:
  cli:
    # NOTE (2026-09-22): /tmp fixture paths and hardcoded app ids replaced by ${FIXTURE_*}
    # placeholders (scripts/prepare-device-fixtures.mjs); executed on Windows via
    # run-device-tier.mjs --include-drafts — passed; promoted draft → approved.
    argv: ["tizen-sdk", "file-transfer", "--direction", "push", "--local", "${FIXTURE_TMP_DIR}/config.xml", "--remote", "/opt/usr/apps/"]
    timeout_sec: 60
    expect:
      status: success
      jsonpath:
        - { path: "$.result.direction", matches: "push" }
        - { path: "$.result.bytes_transferred", matches: "^\\d+" }
