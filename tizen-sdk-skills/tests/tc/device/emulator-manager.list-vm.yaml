# TC-CLI-048: List VMs
id: tizen-sdk.emulator-manager.list-vm
plugin: tizen-sdk
command: emulator-manager
tier: device
status: approved
since_cli: 1.0.0
description: "emulator-manager --action list-vm returns success with the vms array"

lanes:
  cli:
    argv: ["tizen-sdk", "emulator-manager", "--action", "list-vm"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        # Result key is `vms` (+ `count`, `vm_details`) per tizen-create-emulator
        # SKILL.md, not `emulators` — fixed 2026-09-17 after a real run.
        - { path: "$.result.vms", min_length: 0 }
