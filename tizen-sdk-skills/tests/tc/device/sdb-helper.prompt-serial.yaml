# TC-P-076: Prompt — Run command on specific device
id: tizen-sdk.sdb-helper.prompt-serial
plugin: tizen-sdk
command: sdb-helper
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to sdb-helper command"

lanes:
  prompt:
    text: "Run uname -a on the device with serial emulator-26101."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk sdb-helper"
      envelope_status: success
    pass_rate: "2/3"
