# TC-P-053: Prompt — Take screenshot on specific device
id: tizen-sdk.screenshot.prompt-serial
plugin: tizen-sdk
command: screenshot
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to screenshot command"

lanes:
  prompt:
    text: "Take a screenshot of the device with serial emulator-26101."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk screenshot"
      envelope_status: success
    pass_rate: "2/3"
