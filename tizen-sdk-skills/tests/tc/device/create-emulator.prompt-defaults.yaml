# TC-P-041: Prompt — Create emulator with defaults
id: tizen-sdk.create-emulator.prompt-defaults
plugin: tizen-sdk
command: create-emulator
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to create-emulator command"

lanes:
  prompt:
    text: "Create a Tizen emulator with default settings, no prompts."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk create-emulator"
      envelope_status: success
    pass_rate: "2/3"
