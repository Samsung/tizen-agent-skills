# TC-CLI-060: Create image
id: tizen-sdk.emulator-manager.create-image
plugin: tizen-sdk
command: emulator-manager
tier: device
status: approved
since_cli: 1.0.0
description: "emulator-manager --action create-image --vm-name --output-dir --compress returns success"

lanes:
  cli:
    # NOTE (2026-09-22): /tmp/emulator-images replaced by ${FIXTURE_TMP_DIR}/emulator-images
    # (created by scripts/prepare-device-fixtures.mjs, emptied by the driver's resetImageDir
    # hook — em-cli will not create the directory), timeout 120 → 600 s (the base image is
    # copied and compressed); executed on Windows via run-device-tier.mjs --include-drafts —
    # passed; promoted draft → approved.
    argv: ["tizen-sdk", "emulator-manager", "--action", "create-image", "--vm-name", "test-vm", "--output-dir", "${FIXTURE_TMP_DIR}/emulator-images", "--compress"]
    timeout_sec: 600
    expect:
      status: success
