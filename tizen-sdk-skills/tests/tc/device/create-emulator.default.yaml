# Default-name creation (create -d): default-<platform> becomes the canonical
# dotted name, e.g. default-tizen-10.0-x86_64 → T-10.0-x86_64. The platform is
# not fixed: run-device-tier.mjs's prepareDefaultVm hook sets
# ${DEFAULT_VM_PLATFORM} to the newest installed tizen image.
id: tizen-sdk.create-emulator.default
plugin: tizen-sdk
command: create-emulator
tier: device
status: approved
since_cli: 1.11.0
description: "create-emulator --action create --default --platform <newest tizen image> creates its T-<version>-<arch> default VM"

lanes:
  cli:
    argv:
      [
        "tizen-sdk",
        "create-emulator",
        "--action",
        "create",
        "--default",
        "--platform",
        "${DEFAULT_VM_PLATFORM}",
      ]
    timeout_sec: 120
    expect:
      status: success
      jsonpath:
        - { path: "$.result.vm_name", matches: "^T-\\d+\\.\\d+-" }
