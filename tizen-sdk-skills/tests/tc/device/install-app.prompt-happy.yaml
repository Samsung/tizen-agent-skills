# TC-P-049: Prompt 1 — Install my app on the device
id: tizen-sdk.install-app.prompt-happy
plugin: tizen-sdk
command: install-app
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves 'Install my app at C:\\tizen-apps\\MyApp\\MyApp.tpk' to install-app"

lanes:
  prompt:
    text: "Install my app at C:\\tizen-apps\\MyApp\\MyApp.tpk on the device"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk install-app"
      envelope_status: success
    pass_rate: "2/3"
