# TC-CLI-126: Scaffold test file + package.json
id: tizen-sdk.playwright-test.scaffold
plugin: tizen-sdk
command: playwright-test
tier: device
status: approved
since_cli: 1.0.0
description: "playwright-test --scaffold --project-dir --app-id returns success with created[]"

lanes:
  cli:
    # NOTE (2026-09-22): /tmp fixture paths and hardcoded app ids replaced by ${FIXTURE_*}
    # placeholders (scripts/prepare-device-fixtures.mjs); executed on Windows via
    # run-device-tier.mjs --include-drafts — passed; promoted draft → approved.
    argv: ["tizen-sdk", "playwright-test", "--scaffold", "--project-dir", "${FIXTURE_TMP_DIR}/test-project", "--app-id", "${FIXTURE_WEB_APP_ID}"]
    timeout_sec: 60
    expect:
      status: success
      jsonpath:
        - { path: "$.result.created", min_length: 1 }
