# TC-P-102: Prompt — Scaffold Playwright test with force
id: tizen-sdk.playwright-test.prompt-scaffold-force
plugin: tizen-sdk
command: playwright-test
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to playwright-test command"

lanes:
  prompt:
    text: "Scaffold a new Playwright test, overwriting existing files."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk playwright-test"
      envelope_status: success
    pass_rate: "2/3"
