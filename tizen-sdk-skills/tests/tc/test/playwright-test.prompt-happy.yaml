# TC-P-100: Prompt 1 — Scaffold a new Playwright test
id: tizen-sdk.playwright-test.prompt-happy
plugin: tizen-sdk
command: playwright-test
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves 'Scaffold a new Playwright test for my web app' to playwright-test"

lanes:
  prompt:
    text: "Scaffold a new Playwright test for my web app"
