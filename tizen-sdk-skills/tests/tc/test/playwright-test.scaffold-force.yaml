# TC-CLI-127: Scaffold with --force (overwrite)
id: tizen-sdk.playwright-test.scaffold-force
plugin: tizen-sdk
command: playwright-test
tier: device
status: draft
since_cli: 1.0.0
description: "playwright-test --scaffold --force returns success with created[]"

lanes:
  cli:
    argv: ["tizen-sdk", "playwright-test", "--scaffold", "--project-dir", "/tmp/test-project", "--app-id", "abcDEF1234.MyWebApp", "--force"]
    timeout_sec: 60
    expect:
      status: success
      jsonpath:
        - { path: "$.result.created", min_length: 1 }
