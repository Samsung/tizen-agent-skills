# TC-P-106: Prompt — Run Playwright on specific device
id: tizen-sdk.playwright-test.prompt-serial
plugin: tizen-sdk
command: playwright-test
tier: device
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to playwright-test command"

lanes:
  prompt:
    text: "Run Playwright tests on the device with serial emulator-26101."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk playwright-test"
      envelope_status: success
    pass_rate: "2/3"
