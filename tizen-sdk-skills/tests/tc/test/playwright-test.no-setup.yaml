# TC-CLI-129: Run with --no-setup (reuse existing CDP)
id: tizen-sdk.playwright-test.no-setup
plugin: tizen-sdk
command: playwright-test
tier: device
status: approved
since_cli: 1.0.0
description: "playwright-test --app-id --test-file --no-setup returns success"

lanes:
  cli:
    # NOTE (2026-09-22): /tmp fixture paths and hardcoded app ids replaced by ${FIXTURE_*}
    # placeholders (scripts/prepare-device-fixtures.mjs); executed on Windows via
    # run-device-tier.mjs --include-drafts — passed; promoted draft → approved.
    argv: ["tizen-sdk", "playwright-test", "--app-id", "${FIXTURE_WEB_APP_ID}", "--test-file", "${FIXTURE_TMP_DIR}/test-project/tizen-playwright.test.js", "--no-setup"]
    timeout_sec: 120
    expect:
      status: success
