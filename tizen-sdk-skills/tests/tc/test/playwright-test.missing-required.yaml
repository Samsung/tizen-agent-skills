# Required-omission: --app-id is required for a run (not scaffold).
# Source: command-specs/test.ts — --app-id required for run, optional for --scaffold
id: tizen-sdk.playwright-test.missing-required
plugin: tizen-sdk
command: playwright-test
tier: device
status: draft
since_cli: 1.0.0
description: "playwright-test fails with invalid_parameters when --app-id is missing for a run"

lanes:
  cli:
    argv: ["tizen-sdk", "playwright-test"]
    timeout_sec: 30
    expect:
      status: failure
      errors:
        # --app-id is validated by the shared core function (only required for
        # a run, not --scaffold), not by Commander's option parser, so it
        # surfaces as a business-logic invalid_parameters, not invalid_argument.
        - error_category: "invalid_parameters"
          has_suggested_fix: true
