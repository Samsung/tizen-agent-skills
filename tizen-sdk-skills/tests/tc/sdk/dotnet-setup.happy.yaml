# TC-CLI-012: DotNET Setup
id: tizen-sdk.dotnet-setup.happy
plugin: tizen-sdk
command: dotnet-setup
tier: mutating
status: approved
since_cli: 1.0.0
description: "dotnet-setup returns success with workload_installed boolean"

requires:
  capabilities: [sdk]

# NOTE (2026-09-01): the actual field is workload_status, a string enum
# ('installed' | 'already_installed') — see parseWorkloadStatus() in
# common/lib/core/dotnet.js — not a workload_installed boolean.
# NOTE (2026-09-23): the setup script exits at its idempotency check when the Tizen workload is
# present (tizen-dotnet-setup.ps1 / .sh) → workload_status already_installed.
# executed on Windows via scripts/run-mutating-tier.mjs --include-drafts (phase s1-sdk-idempotent) on 2026-09-23 — passed; promoted draft → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "dotnet-setup"]
    timeout_sec: 300
    expect:
      status: success
      jsonpath:
        - { path: "$.result.workload_status", matches: "^(installed|already_installed)$" }
