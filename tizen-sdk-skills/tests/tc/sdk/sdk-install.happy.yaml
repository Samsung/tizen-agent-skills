# TC-CLI-004: Install (default version 10.0)
id: tizen-sdk.sdk-install.happy
plugin: tizen-sdk
command: sdk-install
tier: mutating
status: draft
since_cli: 1.0.0
description: "sdk-install with default version returns success with packages array and installation_status completed"

lanes:
  cli:
    argv: ["tizen-sdk", "sdk-install"]
    timeout_sec: 900
    expect:
      status: success
      jsonpath:
        - { path: "$.result.packages", min_length: 1 }
        - { path: "$.result.installation_status", matches: "completed" }
