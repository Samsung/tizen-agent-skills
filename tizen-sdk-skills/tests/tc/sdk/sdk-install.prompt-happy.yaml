# TC-P-004: Prompt 1 — Install the Tizen SDK
id: tizen-sdk.sdk-install.prompt-happy
plugin: tizen-sdk
command: sdk-install
tier: mutating
status: approved
since_cli: 1.0.0
description: "LLM resolves 'Install the Tizen SDK' to sdk-install command"

lanes:
  prompt:
    text: "Install the Tizen SDK"
    timeout_sec: 600
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk sdk-install"
      envelope_status: success
    pass_rate: "2/3"
