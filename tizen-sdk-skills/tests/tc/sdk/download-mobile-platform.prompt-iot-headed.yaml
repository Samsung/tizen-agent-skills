# TC-P-069: Prompt — Install mobile platform with IOT-Headed
id: tizen-sdk.download-mobile-platform.prompt-iot-headed
plugin: tizen-sdk
command: download-mobile-platform
tier: mutating
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to download-mobile-platform command"

lanes:
  prompt:
    text: "Download the Tizen mobile platform with IOT-Headed extension."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk download-mobile-platform"
      envelope_status: success
    pass_rate: "2/3"
