# TC-CLI-096: Update
id: tizen-sdk.update-package.happy
plugin: tizen-sdk
command: update-package
tier: mutating
status: approved
since_cli: 1.0.0
description: "update-package returns success with packages array and summary"

requires:
  capabilities: [sdk, net]

# NOTE (2026-09-01): result.packages was hardcoded to always be an empty
# array in common/lib/core/sdk.js's updatePackage() ('const packages = [];',
# never populated) even though the bash script prints exactly the per-package
# detail needed — fixed to parse it. That fix is orthogonal to this
# assertion though: an empty array is the CORRECT result whenever nothing is
# outdated (the common case on an already-current SDK), so min_length was
# relaxed from 1 to 0 — a non-empty result isn't something this TC can force
# without either a genuinely stale package or a full --force reinstall of
# every installed package, which is out of scope here (same risk class as
# sdk-install --force).
# NOTE (2026-09-23): stays draft. In the test harness the CLI runs as `node tizen-sdk.js`, and the
# installer branch of this command only executes under the packaged CLI (process.pkg;
# common/lib/core/sdk.js) — without the already-installed short-circuit the command returns
# execution_error here. It also downloads into / reinstalls the host's real SDK. Needs a
# host running the packaged CLI with network (capabilities sdk, net); not run in this pass.
# update-package has no short-circuit: non-pkg it only succeeds from a fresh .package-update-result marker.
# NOTE (2026-09-28): runnable now. common/lib/core/sdk.js runsInstallerInline() also honours
# TIZEN_SDK_INLINE_INSTALLER=1, and scripts/run-mutating-tier.mjs --with-installers runs phase
# s2-sdk-installers with USERPROFILE/HOME pointed at a throwaway home (TIZEN_SDK_PATH removed), so the
# install lands in <scratch>/home/tizen-sdk and the host's SDK is never touched. Still capabilities
# sdk, net: ~10 GB from the repository. timeout_sec covers the download; the runner must never cut
# the installer off mid-write (execFileSync kills node, not the PowerShell it spawned).
# NOTE (2026-09-28): executed — scripts/run-mutating-tier.mjs --yes --with-installers --include-drafts, phase
# s2-sdk-installers against the throwaway home (log: <scratch>/run.log). Passed → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "update-package"]
    timeout_sec: 1800
    expect:
      status: success
      jsonpath:
        - { path: "$.result.packages", min_length: 0 }
        - { path: "$.result.summary", min_length: 1 }
