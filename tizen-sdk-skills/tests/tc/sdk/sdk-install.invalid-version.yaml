# TC-CLI-009: Install invalid version
id: tizen-sdk.sdk-install.invalid-version
plugin: tizen-sdk
command: sdk-install
tier: safe
status: approved
since_cli: 1.0.0
description: "sdk-install with a malformed --tizen-version fails with invalid_argument"

lanes:
  cli:
    # sdk-install has no --version option — that flag collides with
    # Commander's own reserved --version (prints the CLI's own version,
    # "1.0.0", and exits via the commander.version code path with no JSON
    # envelope at all). The real flag for the platform version is --tizen-version.
    #
    # Tizen platform versions are X.Y (the TIZEN-X.Y package: 10.0, 11.0, ...).
    # Anything else is rejected by the pre-check before it looks at the host,
    # so this TC behaves the same whether or not an SDK is installed. Before
    # the fix the pre-check ignored the value and reported "already installed"
    # (success) on any host with an SDK — with 99.99.99 echoed as the version.
    argv: ["tizen-sdk", "sdk-install", "--tizen-version", "99.99.99"]
    timeout_sec: 60
    expect:
      status: failure
      errors:
        - { error_category: "invalid_argument" }
