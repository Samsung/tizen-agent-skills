# TC-CLI-013: Force reinstall workload
id: tizen-sdk.dotnet-setup.force
plugin: tizen-sdk
command: dotnet-setup
tier: mutating
status: approved
since_cli: 1.0.0
description: "dotnet-setup --force returns success with workload_installed boolean"

requires:
  capabilities: [sdk, net]

# NOTE (2026-09-01): the actual field is workload_status, a string enum
# ('installed' | 'already_installed') — see parseWorkloadStatus() in
# common/lib/core/dotnet.js — not a workload_installed boolean.
# NOTE (2026-09-23): stays draft — --force reinstalls the Tizen .NET workload (network, several
# minutes) on the host's real dotnet install; not run in this pass.
# NOTE (2026-09-28): runnable now via scripts/run-mutating-tier.mjs --with-installers, phase
# s3-dotnet-workload — no home redirect (the workload lives in the real dotnet install; a redirected
# USERPROFILE would only push NuGet into the scratch dir). Reinstalls the host's Tizen workload.
# NOTE (2026-09-28): executed — scripts/run-mutating-tier.mjs --yes --with-installers --include-drafts, phase
# s3-dotnet-workload (workload reinstalled, workload_status matched). Passed → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "dotnet-setup", "--force"]
    timeout_sec: 1800
    expect:
      status: success
      jsonpath:
        - { path: "$.result.workload_status", matches: "^(installed|already_installed)$" }
