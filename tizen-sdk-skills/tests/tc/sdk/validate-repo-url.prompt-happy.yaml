# TC-P-016: Prompt — Validate a repository URL
id: tizen-sdk.validate-repo-url.prompt-happy
plugin: tizen-sdk
command: validate-repo-url
tier: safe
status: approved
since_cli: 1.0.0
description: "LLM resolves 'Validate this repository URL http://example.com/repo' to validate-repo-url"

lanes:
  prompt:
    text: "Validate this repository URL: http://example.com/repo"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk validate-repo-url"
      envelope_status: success
    pass_rate: "2/3"
