# TC-CLI-094: TV SDK Install
id: tizen-sdk.tv-sdk-install.happy
plugin: tizen-sdk
command: tv-sdk-install
tier: mutating
status: approved
since_cli: 1.0.0
description: "tv-sdk-install returns success with packages array"

requires:
  capabilities: [sdk]

# NOTE (2026-09-23): with <sdk>/.tv-sdk-installed present the command short-circuits (sdk.js
# installTvSdk) and reports the installed TV extension as its one package; no download.
# executed on Windows via scripts/run-mutating-tier.mjs --include-drafts (phase s1-sdk-idempotent) on 2026-09-23 — passed; promoted draft → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "tv-sdk-install"]
    timeout_sec: 600
    expect:
      status: success
      jsonpath:
        - { path: "$.result.packages", min_length: 1 }
