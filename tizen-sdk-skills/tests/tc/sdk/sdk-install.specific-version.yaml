# TC-CLI-005: Install specific version
id: tizen-sdk.sdk-install.specific-version
plugin: tizen-sdk
command: sdk-install
tier: mutating
status: approved
since_cli: 1.0.0
description: "sdk-install with --tizen-version and --label returns success"

requires:
  capabilities: [sdk]

# NOTE (2026-09-23): already-installed path (platforms/tizen-10.0 present); see sdk-install.happy.
# executed on Windows via scripts/run-mutating-tier.mjs --include-drafts (phase s1-sdk-idempotent) on 2026-09-23 — passed; promoted draft → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "sdk-install", "--tizen-version", "10.0", "--label", "tizen"]
    timeout_sec: 900
    expect:
      status: success
      jsonpath:
        - { path: "$.result.packages", min_length: 1 }
        - { path: "$.result.installation_status", matches: "completed" }
