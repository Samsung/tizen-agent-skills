# TC-P-084: Prompt — Force reinstall .NET workload
id: tizen-sdk.dotnet-setup.prompt-force
plugin: tizen-sdk
command: dotnet-setup
tier: mutating
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to dotnet-setup command"

lanes:
  prompt:
    text: "Force reinstall the Tizen .NET workload."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk dotnet-setup"
      envelope_status: success
    pass_rate: "2/3"
