# TC-CLI-070: Install custom rootstrap from ZIP
id: tizen-sdk.install-rootstrap.happy
plugin: tizen-sdk
command: install-rootstrap
tier: mutating
status: approved
since_cli: 1.0.0
description: "install-rootstrap --zip-path returns success with rootstraps array"

requires:
  capabilities: [sdk]

# NOTE (2026-09-23): stays draft for two reasons: --zip-path /tmp/custom-rootstrap.zip names a
# fixture nothing in the repo produces (a valid ZIP is data/ or tizen-studio/ containing
# tools/smart-build-interface/plugins/*.core*.xml — see tizen-install-rootstrap.ps1), and
# installRootstrap only runs the installer under the packaged CLI (process.pkg; sdk.js),
# so the test harness gets execution_error regardless of the ZIP.
# NOTE (2026-09-28): the ZIP is now a fixture — scripts/prepare-device-fixtures.mjs --only=rootstrap
# builds ${FIXTURE_ROOTSTRAP_ZIP} (data/tools/smart-build-interface/plugins/custom-10.0-fixture.core.xml,
# the smallest layout tizen-install-rootstrap accepts), and installRootstrap now passes -SdkPath so
# the script cannot fall back to Get-SdkPath and pick the host's SDK.
# NOTE (2026-09-28): runnable now. common/lib/core/sdk.js runsInstallerInline() also honours
# TIZEN_SDK_INLINE_INSTALLER=1, and scripts/run-mutating-tier.mjs --with-installers runs phase
# s2-sdk-installers with USERPROFILE/HOME pointed at a throwaway home (TIZEN_SDK_PATH removed), so the
# install lands in <scratch>/home/tizen-sdk and the host's SDK is never touched. Still capabilities
# sdk, net: ~10 GB from the repository. timeout_sec covers the download; the runner must never cut
# the installer off mid-write (execFileSync kills node, not the PowerShell it spawned).
# NOTE (2026-09-28): executed — scripts/run-mutating-tier.mjs --yes --with-installers --include-drafts, phase
# s2-sdk-installers against the throwaway home (log: <scratch>/run.log). Passed → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "install-rootstrap", "--zip-path", "${FIXTURE_ROOTSTRAP_ZIP}"]
    timeout_sec: 600
    expect:
      status: success
      jsonpath:
        - { path: "$.result.rootstraps", min_length: 1 }
