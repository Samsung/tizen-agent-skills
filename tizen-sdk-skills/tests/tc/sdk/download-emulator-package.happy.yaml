# TC-CLI-064: Download (auto-detect version)
id: tizen-sdk.download-emulator-package.happy
plugin: tizen-sdk
command: download-emulator-package
tier: mutating
status: draft
since_cli: 1.0.0
description: "download-emulator-package returns success with packages array"

lanes:
  cli:
    argv: ["tizen-sdk", "download-emulator-package"]
    timeout_sec: 600
    expect:
      status: success
      jsonpath:
        - { path: "$.result.packages", min_length: 1 }
        - { path: "$.result.installation_status", matches: "completed" }
