# TC-P-083: Prompt — DotNET setup
id: tizen-sdk.dotnet-setup.prompt-variant1
plugin: tizen-sdk
command: dotnet-setup
tier: mutating
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to dotnet-setup command"

lanes:
  prompt:
    text: "Set up .NET development environment for Tizen."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk dotnet-setup"
      envelope_status: success
    pass_rate: "2/3"
