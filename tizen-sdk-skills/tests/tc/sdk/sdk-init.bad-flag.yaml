# TC-CLI-003: Bad flag → failure, invalid_argument
id: tizen-sdk.sdk-init.bad-flag
plugin: tizen-sdk
command: sdk-init
tier: safe
status: draft
since_cli: 1.0.0
description: "sdk-init with unknown flag returns failure with invalid_argument"

lanes:
  cli:
    argv: ["tizen-sdk", "sdk-init", "--bogus"]
    timeout_sec: 30
    expect:
      status: failure
      errors:
        - { error_category: "invalid_argument" }
