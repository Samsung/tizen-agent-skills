# TC-CLI-122: Install from custom repo
id: tizen-sdk.sdk-install-custom-repo.happy
plugin: tizen-sdk
command: sdk-install-custom-repo
tier: mutating
status: approved
since_cli: 1.0.0
description: "sdk-install-custom-repo --repo-url returns success with packages and repository_url"

requires:
  capabilities: [sdk, net]

# NOTE: the repository URL is a ${TC_CUSTOM_REPO_URL} placeholder that
# runner.mjs resolves from fixtures/fixtures.env (default: the public Tizen
# Studio repository), the environment, or this TC's `env:` block. A literal
# example.com URL never serves pkg_list_{OS}, so validation would fail before
# the install path is exercised. Point the variable at your own mirror to test
# a private repository.
# NOTE (2026-09-23): validates the repository URL over the network, then the already-installed
# path (sdk.js installSdkFromRepo): packages, repository_url, installation_status completed.
# executed on Windows via scripts/run-mutating-tier.mjs --include-drafts (phase s1-sdk-idempotent) on 2026-09-23 — passed; promoted draft → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "sdk-install-custom-repo", "--repo-url", "${TC_CUSTOM_REPO_URL}"]
    timeout_sec: 900
    expect:
      status: success
      jsonpath:
        - { path: "$.result.packages", min_length: 1 }
        - { path: "$.result.repository_url", min_length: 1 }
        - { path: "$.result.installation_status", matches: "completed" }
