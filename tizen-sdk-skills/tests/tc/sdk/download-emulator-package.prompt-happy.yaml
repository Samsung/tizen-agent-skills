# TC-P-008: Prompt — Download emulator package
id: tizen-sdk.download-emulator-package.prompt-happy
plugin: tizen-sdk
command: download-emulator-package
tier: mutating
status: approved
since_cli: 1.0.0
description: "LLM resolves 'Download the Tizen emulator package' to download-emulator-package"

lanes:
  prompt:
    text: "Download the Tizen emulator package"
    timeout_sec: 600
