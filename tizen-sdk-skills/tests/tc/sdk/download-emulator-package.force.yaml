# TC-CLI-066: Force reinstall
id: tizen-sdk.download-emulator-package.force
plugin: tizen-sdk
command: download-emulator-package
tier: mutating
status: draft
since_cli: 1.0.0
description: "download-emulator-package --force returns success"

lanes:
  cli:
    argv: ["tizen-sdk", "download-emulator-package", "--force"]
    timeout_sec: 600
    expect:
      status: success
      jsonpath:
        - { path: "$.result.packages", min_length: 1 }
        - { path: "$.result.installation_status", matches: "completed" }
