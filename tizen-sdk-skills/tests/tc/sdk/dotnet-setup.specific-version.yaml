# TC-CLI-014: Specific workload version
id: tizen-sdk.dotnet-setup.specific-version
plugin: tizen-sdk
command: dotnet-setup
tier: mutating
status: draft
since_cli: 1.0.0
description: "dotnet-setup --workload-version returns success with workload_installed boolean"

# NOTE (2026-09-01): the actual field is workload_status, a string enum
# ('installed' | 'already_installed') — see parseWorkloadStatus() in
# common/lib/core/dotnet.js — not a workload_installed boolean.
lanes:
  cli:
    argv: ["tizen-sdk", "dotnet-setup", "--workload-version", "9.0.0"]
    timeout_sec: 300
    expect:
      status: success
      jsonpath:
        - { path: "$.result.workload_status", matches: "^(installed|already_installed)$" }
