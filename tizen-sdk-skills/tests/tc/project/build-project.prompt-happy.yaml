# TC-P-020: Prompt 1 — Build my Tizen project in Debug mode
id: tizen-sdk.build-project.prompt-happy
plugin: tizen-sdk
command: build-project
tier: mutating
status: approved
since_cli: 1.0.0
description: "LLM resolves 'Build my Tizen project in Debug mode' to build-project"

lanes:
  prompt:
    text: "Build my Tizen project at C:\\tizen-apps\\MyApp in Debug mode"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk build-project"
      envelope_status: success
    pass_rate: "2/3"
