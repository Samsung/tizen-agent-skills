# TC-P-019: Prompt — Delete a Tizen project
id: tizen-sdk.project-delete.prompt-happy
plugin: tizen-sdk
command: project-delete
tier: mutating
status: approved
since_cli: 1.0.0
description: "LLM resolves 'Delete my Tizen project at C:\\tizen-apps\\MyApp' to project-delete"

lanes:
  prompt:
    text: "Delete my Tizen project at C:\\tizen-apps\\MyApp"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk project-delete"
      envelope_status: success
    pass_rate: "2/3"
