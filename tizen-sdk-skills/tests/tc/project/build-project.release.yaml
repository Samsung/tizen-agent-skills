# TC-CLI-025: Build Release with signing
id: tizen-sdk.build-project.release
plugin: tizen-sdk
command: build-project
tier: mutating
status: approved
since_cli: 1.0.0
description: "build-project --build-type Release --sign-profile returns success with artifacts"

requires:
  capabilities: [sdk]

# NOTE (2026-09-01): --project pointed at /tmp/tizen-apps/MyApp, a path
# create-project can never produce (package IDs must be exactly 10
# alphanumeric characters; "myapp" is 5). Renamed to a valid target and
# fixed the surrounding setup gaps: build-project needs the project to
# exist, an active signing profile (for non-GBS builds), and the target
# rootstrap installed — all separately fixed elsewhere in this session
# (create-project.*, certificate-manager profile fixtures,
# download-emulator-package/platform-install auto-detect bug).
# NOTE (2026-09-23): target is the project create-project.native-happy makes; myProfile is the
# profile scripts/prepare-device-fixtures.mjs creates from the fixture cert. executed on Windows via scripts/run-mutating-tier.mjs --include-drafts
# (phase p1-projects) on 2026-09-23 — passed; promoted draft → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "build-project", "--project", "${FIXTURE_PROJECTS_DIR}/MyNativeApp", "--build-type", "Release", "--sign-profile", "myProfile"]
    timeout_sec: 300
    expect:
      status: success
      jsonpath:
        - { path: "$.result.artifacts", min_length: 1 }
