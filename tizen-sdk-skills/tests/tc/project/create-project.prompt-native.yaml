# TC-P-021: Prompt — Create a native Tizen app
id: tizen-sdk.create-project.prompt-native
plugin: tizen-sdk
command: create-project
tier: mutating
status: approved
since_cli: 1.0.0
description: "LLM resolves prompt to create-project command"

lanes:
  prompt:
    text: "Create a new native Tizen app called MyApp."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk create-project"
      envelope_status: success
    pass_rate: "2/3"
