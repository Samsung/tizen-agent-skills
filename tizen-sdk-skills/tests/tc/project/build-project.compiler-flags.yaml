# TC-CLI-024: Build with specific compiler flags
id: tizen-sdk.build-project.compiler-flags
plugin: tizen-sdk
command: build-project
tier: mutating
status: approved
since_cli: 1.0.0
description: "build-project rejects an unsupported compiler-flag option with invalid_argument (no passthrough exists)"

# NOTE (2026-09-01): --project pointed at /tmp/tizen-apps/MyApp, a path
# create-project can never produce (package IDs must be exactly 10
# alphanumeric characters; "myapp" is 5). Renamed to a valid target and
# fixed the surrounding setup gaps: build-project needs the project to
# exist, an active signing profile (for non-GBS builds), and the target
# rootstrap installed — all separately fixed elsewhere in this session
# (create-project.*, certificate-manager profile fixtures,
# download-emulator-package/platform-install auto-detect bug).
# NOTE (2026-09-23): stayed draft (product gap, not a fixture problem). build-project has no
# compiler-flag passthrough (command-specs/project.ts: --project/--build-type/--sign-profile/
# --arch/--clean only) and tizen-cli's Commander 12 dropped the trailing `CFLAGS=-O2` token
# silently (default allowExcessArguments), so a run would only have proved an ordinary Debug build.
# NOTE (2026-09-28): rewritten to assert what the CLI actually does with a compiler-flag
# request: `--cflags` is not a registered option, Commander raises commander.unknownOption
# and tizen-cli/src/index.ts wraps it as a failure envelope with error_category
# invalid_argument. The parser rejects it before the handler runs, so the project need not
# exist and nothing is built. Re-author as a success TC once a passthrough option exists.
# NOTE (2026-09-28): executed — scripts/run-mutating-tier.mjs --yes --with-installers --include-drafts, phase
# p1-projects: commander.unknownOption / invalid_argument as expected. Passed → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "build-project", "--project", "${FIXTURE_PROJECTS_DIR}/MyNativeApp", "--cflags", "-O2"]
    timeout_sec: 60
    expect:
      status: failure
      errors:
        - error_code: "commander.unknownOption"
          error_category: "invalid_argument"
