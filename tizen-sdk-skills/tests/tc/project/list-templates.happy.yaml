# TC-CLI-015: List all templates
id: tizen-sdk.list-templates.happy
plugin: tizen-sdk
command: list-templates
tier: safe
status: approved
since_cli: 1.0.0
description: "list-templates returns success with templates array"

# The template catalogue is read from the installed SDK — without one the
# command fails, so the CI safe-tier gate skips this TC (--skip-requires=sdk).
requires:
  capabilities: [sdk]

lanes:
  cli:
    argv: ["tizen-sdk", "list-templates"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        - { path: "$.result.templates", min_length: 1 }
