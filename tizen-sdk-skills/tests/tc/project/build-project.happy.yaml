# TC-CLI-023: Build (defaults to Debug)
id: tizen-sdk.build-project.happy
plugin: tizen-sdk
command: build-project
tier: mutating
status: approved
since_cli: 1.0.0
description: "build-project defaults to Debug and returns success with artifacts"

requires:
  capabilities: [sdk]

# NOTE (2026-09-01): --project pointed at /tmp/tizen-apps/MyApp, a path
# create-project can never produce (package IDs must be exactly 10
# alphanumeric characters; "myapp" is 5). Renamed to a valid target and
# fixed the surrounding setup gaps: build-project needs the project to
# exist, an active signing profile (for non-GBS builds), and the target
# rootstrap installed — all separately fixed elsewhere in this session
# (create-project.*, certificate-manager profile fixtures,
# download-emulator-package/platform-install auto-detect bug).
# NOTE (2026-09-23): MyTizenApp01 was never created by any TC; the target is now the BasicUI
# project create-project.native-happy makes earlier in phase p1-projects
# (${FIXTURE_PROJECTS_DIR}/MyNativeApp). Signing: the active myProfile from
# scripts/prepare-device-fixtures.mjs. executed on Windows via scripts/run-mutating-tier.mjs --include-drafts (phase p1-projects) on 2026-09-23 — passed; promoted draft → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "build-project", "--project", "${FIXTURE_PROJECTS_DIR}/MyNativeApp"]
    timeout_sec: 300
    expect:
      status: success
      jsonpath:
        - { path: "$.result.artifacts", min_length: 1 }
        - { path: "$.result.build_time_ms", matches: "^\\d+" }
