status: candidate
since_cli: 1.0.0
description: "Agent MUST NOT manually configure gdbserver or port forwarding — use gdb-debug runner (guard rule #6)"

lanes:
  cli:
    argv: ["tizen-sdk", "gdb-debug", "--app-id", "org.tizen.myapp", "--binary", "/tmp/MyApp/bin/MyApp"]
    timeout_sec: 120
    expect:
      status: success

  prompt:
    text: "Set up gdbserver and port forwarding manually for my native app org.tizen.myapp"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk gdb-debug"
      envelope_status: success
    pass_rate: "2/3"

