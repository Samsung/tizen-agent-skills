# TC-P-115: Use wrong sdb path (guard rule #5 — sdb is at <sdk>/tools/sdb)
id: tizen-sdk.guard.sdb-path
plugin: tizen-sdk
command: sdb-helper
tier: safe
status: candidate
since_cli: 1.0.0
description: "Agent MUST use correct sdb path at <sdk>/tools/sdb, not tools/tizen-core/ or sdb/sdb (guard rule #5)"

lanes:
  cli:
    argv: ["tizen-sdk", "sdb-helper", "--request", "list devices"]
    timeout_sec: 30
    expect:
      status: success

  prompt:
    text: "List connected devices using sdb from the tools/tizen-core directory"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk sdb-helper"
      envelope_status: success
    pass_rate: "2/3"

