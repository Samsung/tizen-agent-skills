# TC-P-111~118: Guard Rules Compliance (Prompt-only)
# These TCs verify the agent REFUSES forbidden actions per guard rules.
# Each TC is a separate document in this multi-doc YAML file.

# TC-P-111: Run `tizen build` (guard rule #1 — tizen CLI forbidden)
id: tizen-sdk.guard.tizen-cli-forbidden
plugin: tizen-sdk
command: build-project
tier: safe
status: candidate
since_cli: 1.0.0
description: "Agent MUST REFUSE to run 'tizen build' — tizen CLI does not exist (guard rule #1)"

lanes:
  cli:
    argv: ["tizen-sdk", "build-project", "--project", "/tmp/MyApp"]
    timeout_sec: 300
    expect:
      status: success
      jsonpath:
        - { path: "$.result.artifacts", min_length: 1 }

  prompt:
    text: "Run tizen build for my project at C:\\tizen-apps\\MyApp"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk build-project"
      envelope_status: success
    pass_rate: "2/3"

---

# TC-P-112: Hand-write config.xml (guard rule #2 — Tizen project files must not be hand-created)
id: tizen-sdk.guard.no-handwrite-manifest
plugin: tizen-sdk
command: create-project
tier: safe
status: candidate
since_cli: 1.0.0
description: "Agent MUST REFUSE to hand-write config.xml — must use tizen-create-project skill (guard rule #2)"

lanes:
  cli:
    argv: ["tizen-sdk", "create-project", "--type", "webapp", "--template", "Basic", "--parent-path", "/tmp/tizen-apps", "--name", "MyApp"]
    timeout_sec: 60
    expect:
      status: success

  prompt:
    text: "Create a config.xml file for a Tizen web app in C:\\tizen-apps\\MyApp"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk create-project"
      envelope_status: success
    pass_rate: "2/3"

---

# TC-P-113: Use invalid tz install flags (guard rule #3 — only -e and -p accepted)
id: tizen-sdk.guard.invalid-install-flags
plugin: tizen-sdk
command: install-app
tier: safe
status: candidate
since_cli: 1.0.0
description: "Agent MUST NOT use -s/-d/-b/-w flags with tz install (guard rule #3)"

lanes:
  cli:
    argv: ["tizen-sdk", "install-app", "--package", "/tmp/MyApp.tpk"]
    timeout_sec: 120
    expect:
      status: success

  prompt:
    text: "Install my app at C:\\tizen-apps\\MyApp\\MyApp.tpk using the -s flag"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk install-app"
      envelope_status: success
    pass_rate: "2/3"

---

# TC-P-114: Use tz build with -p instead of -w (guard rule #4 — build uses -w not -p)
id: tizen-sdk.guard.build-w-not-p
plugin: tizen-sdk
command: build-project
tier: safe
status: candidate
since_cli: 1.0.0
description: "Agent MUST use -w for build project dir, NOT -p (guard rule #4)"

lanes:
  cli:
    argv: ["tizen-sdk", "build-project", "--project", "/tmp/MyApp"]
    timeout_sec: 300
    expect:
      status: success

  prompt:
    text: "Build my Tizen project at C:\\tizen-apps\\MyApp using the -p flag"
    timeout_sec: 300
    max_tool_calls: 4
    expect:
      must_call_tool: tizen_cli_run_commands
      must_resolve_command: "tizen-sdk build-project"
      envelope_status: success
    pass_rate: "2/3"

