# TC-P-107: Prompt — Show plugin schema
#
# `--schema` is a top-level meta-flag of the tizen-sdk plugin's own CLI
# entry point, not a registered command — there is no plugin+command+args
# triple that reaches it through tizen_cli_run_commands (verified: the plugin
# schema served to the MCP gateway only lists the 33 real commands, "--schema"
# is not among them, so run_commands would reject it as "Command not found").
# The reachable equivalent for "what can this plugin do" is the discovery
# tool tizen_cli_list_commands({ plugin: "tizen-sdk" }) (no `command`),
# which returns every command with its description and arg_count — verified
# live. It is lighter than the CLI's own --schema (no per-option inputSchema),
# but it is the only MCP-reachable answer to this prompt.
id: tizen-sdk.meta.prompt-schema
plugin: tizen-sdk
command: --schema
tier: safe
status: approved
since_cli: 1.0.0
description: "LLM resolves a plugin-schema prompt to the list_commands discovery tool"

lanes:
  prompt:
    text: "Show me the plugin schema for tizen-sdk."
    timeout_sec: 300
    max_tool_calls: 6
    expect:
      must_call_tool: tizen_cli_list_commands
      # list_commands has no CLI-invocation concept, so this records the
      # `plugin` argument the call must carry (no `command` — a per-command
      # call only returns one command's schema, not the whole plugin's).
      must_resolve_command: "tizen-sdk"
    pass_rate: "2/3"
