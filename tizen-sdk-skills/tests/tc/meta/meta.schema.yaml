# TC-CLI-134: Show plugin schema
id: tizen-sdk.meta.schema
plugin: tizen-sdk
command: "--schema"
tier: safe
status: approved
since_cli: 1.0.0
description: "--schema returns plugin, version, and commands object"

lanes:
  cli:
    argv: ["tizen-sdk", "--schema"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        - { path: "$.result.plugin", min_length: 1 }
        - { path: "$.result.version", matches: "^\\d+\\.\\d+\\.\\d+" }
        - { path: "$.result.commands", min_length: 1 }
        # Password options must be flagged so MCP hosts mask them in their
        # transcripts, and the entry must stay a schema object (type kept) —
        # not be collapsed to "***" by the envelope's field-name masking.
        - {
            path: "$.result.commands.certificate-manager.args.--password.sensitive",
            equals: true,
          }
        - {
            path: "$.result.commands.certificate-manager.args.--password.type",
            equals: "string",
          }
        - {
            path: "$.result.commands.certificate-manager.args.--author-password.sensitive",
            equals: true,
          }
