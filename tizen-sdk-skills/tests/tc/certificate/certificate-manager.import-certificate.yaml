# TC-CLI-038: Import certificate
#
# NOTE (2026-09-01): --source pointed at a nonexistent /tmp/import.p12.
# Swapped for a real, committed fixture cert.
id: tizen-sdk.certificate-manager.import-certificate
plugin: tizen-sdk
command: certificate-manager
tier: mutating
status: approved
since_cli: 1.0.0
description: "certificate-manager --action import-certificate returns success"

requires:
  capabilities: [sdk]

# NOTE (2026-09-23): destination is <sdk-data>/keystore/author/test-fixture-author.p12 and the
# import refuses to overwrite (cert_already_exists, certificate.js importCertificate); the
# mutating driver's cleanKeystore hook removes that file before phase k2 and in teardown.
# executed on Windows via scripts/run-mutating-tier.mjs --include-drafts (phase k2-cert-keystore) on 2026-09-23 — passed; promoted draft → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "certificate-manager", "--action", "import-certificate", "--source", "fixtures/certs/test-fixture-author.p12", "--certificate-type", "author", "--password", "${FIXTURE_CERT_UNLOCK}"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        - { path: "$.result.imported_path", min_length: 1 }
