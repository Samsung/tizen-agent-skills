# TC-CLI-033: List distributor certificates
id: tizen-sdk.certificate-manager.list-distributors
plugin: tizen-sdk
command: certificate-manager
tier: mutating
status: approved
since_cli: 1.0.0
description: "certificate-manager --action list-distributors returns success with distributors array"

requires:
  capabilities: [sdk]

# NOTE (2026-09-23): executed on Windows via scripts/run-mutating-tier.mjs --include-drafts (phase k1-cert-readonly) on 2026-09-23 — passed; promoted draft → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "certificate-manager", "--action", "list-distributors"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        - { path: "$.result.distributors", min_length: 1 }
