# Verify certificate-manager list-profiles returns success (read-only action).
# Source: command-specs/certificate.ts — action list-profiles, no side effects
id: tizen-sdk.certificate-manager.list-profiles.happy
plugin: tizen-sdk
command: certificate-manager
tier: safe
status: approved
since_cli: 1.0.0
description: "certificate-manager list-profiles returns success with profile list"

# profiles.xml lives under the SDK data path, which resolveSdkDataPath() can
# only find with a configured SDK root (or an sdb inside an SDK on PATH). The
# CI safe-tier gate skips this TC (--skip-requires=sdk).
requires:
  capabilities: [sdk]

lanes:
  cli:
    argv:
      ["tizen-sdk", "certificate-manager", "--action", "list-profiles"]
    timeout_sec: 30
    expect:
      status: success
