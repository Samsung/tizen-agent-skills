# TC-CLI-043: Import certificate as a distributor cert
#
# CORRECTED (2026-09-01): the original TC used `--action import` and
# `--file-path`, neither of which exists — the real action is
# `import-certificate` with `--source` (see command-specs/certificate.ts).
# It was also an exact duplicate of import-certificate.happy once the names
# were fixed, so rewritten to cover the untested `--certificate-type
# distributor` path instead of re-testing `author`, and to assert on the
# real result field (`imported_path`; there is no boolean `imported` field).
id: tizen-sdk.certificate-manager.import-certificate-from-file
plugin: tizen-sdk
command: certificate-manager
tier: mutating
status: approved
since_cli: 1.0.0
description: "certificate-manager import-certificate --certificate-type distributor returns success"

requires:
  capabilities: [sdk]

# NOTE (2026-09-23): destination is <sdk-data>/keystore/distributor/test-fixture-author.p12;
# removed by the mutating driver's cleanKeystore hook before phase k2 (import refuses to
# overwrite). executed on Windows via scripts/run-mutating-tier.mjs --include-drafts (phase k2-cert-keystore) on 2026-09-23 — passed; promoted draft → approved.
lanes:
  cli:
    argv: ["tizen-sdk", "certificate-manager", "--action", "import-certificate", "--source", "fixtures/certs/test-fixture-author.p12", "--certificate-type", "distributor", "--password", "${FIXTURE_CERT_UNLOCK}"]
    timeout_sec: 30
    expect:
      status: success
      jsonpath:
        - { path: "$.result.imported_path", min_length: 1 }
        - { path: "$.result.certificate_type", equals: "distributor" }
